name: usage-rollup

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 00:30 IST (after nightly backup)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollup:
    name: clinic usage snapshots
    runs-on: ubuntu-latest
    environment: production-db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.18"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: apps/api
        run: uv sync --frozen || uv sync
      - name: Roll up clinic usage
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
        run: uv run python ../../scripts/rollup_clinic_usage.py
