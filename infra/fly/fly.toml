# =============================================================================
# Fly.io deploy config for the API. DEPLOY-ONLY: never read at runtime by the app.
# Region SIN (Singapore) — near Neon ap-southeast-1. Swap to bom for India residency.
# Swap to AWS by switching to infra/aws/* + .github/workflows/deploy-aws.yml.template.
# =============================================================================

app = "clinic-crm-api"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../docker/api.Dockerfile"

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
